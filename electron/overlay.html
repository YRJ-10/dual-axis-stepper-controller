<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controller Monitor</title>
    <link rel="stylesheet" href="./overlay.css">
  </head>
  <body class="offline">
    <main class="monitor" aria-label="Controller monitor">
      <header>
        <div class="header-left">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connectionLabel">OFFLINE</span>
        </div>
        <div class="header-right motion-state">
          <span>SPD:</span><strong id="speedValue">0</strong>
          <span style="margin-left:5px;">ST:</span><strong id="runState">STOP</strong>
        </div>
      </header>
      
      <section class="mode-control">
        <div id="modeButtons" class="mode-buttons" role="group"></div>
      </section>

      <section class="action-bar">
        <button id="btnPlayPreset" class="btn-action btn-play" title="Kirim & Mainkan Preset Mode 11">▶️ Mode 11</button>
        <button id="btnStop" class="btn-action btn-stop" title="Berhenti (STOP)">⏹️ STOP</button>
      </section>

      <section class="jog-bar">
        <div class="jog-row">
          <span class="jog-label">M1</span>
          <button id="btnJogM1Bwd" class="btn-jog" title="M1 Mundur">◀</button>
          <button id="btnJogM1Fwd" class="btn-jog" title="M1 Maju">▶</button>
        </div>
        <div class="jog-row">
          <span class="jog-label">M2</span>
          <button id="btnJogM2Bwd" class="btn-jog" title="M2 Mundur">◀</button>
          <button id="btnJogM2Fwd" class="btn-jog" title="M2 Maju">▶</button>
        </div>
      </section>
    </main>
    <script src="./overlay.js"></script>
  </body>
</html>
