<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dual Axis Stepper Tuner</title>
    <link rel="stylesheet" href="./style.css?v=20260722-compact1">
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="Serial controls">
        <div>
          <h1>Dual Axis Stepper Tuner</h1>
          <p id="connectionStatus">Belum terhubung</p>
        </div>
        <div class="active-display" aria-label="Active mode display">
          <span>Mode Aktif Sekarang</span>
          <strong id="currentActiveMode">-</strong>
        </div>
        <div class="actions">
          <div id="desktopPortControls" class="serial-port-controls" hidden>
            <label for="serialPortSelect">
              <span>Port COM</span>
              <select id="serialPortSelect" aria-label="Port COM"></select>
            </label>
            <button id="refreshPortsButton" type="button">Refresh COM</button>
          </div>
          <button id="connectButton" type="button">Connect</button>
          <button id="disconnectButton" type="button" disabled>Disconnect</button>
        </div>
      </section>

      <section class="control-strip" aria-label="Mode controls">
        <div class="mode-picker">
          <span>Mode Aktif</span>
          <div id="modeButtonGroup" class="mode-button-group" role="group" aria-label="Pilih mode aktif"></div>
        </div>
        <button id="readButton" type="button" disabled>Read Arduino</button>
        <button id="saveButton" type="button" disabled>Save EEPROM</button>
        <button id="loadButton" type="button" disabled>Load EEPROM</button>
        <div id="commandStatus" class="command-status" role="status">Siap</div>
      </section>

      <section id="speedPanel" class="speed-panel" aria-label="Speed control" tabindex="0">
        <div class="speed-readout">
          <span>Speed</span>
          <strong id="speedValue">0</strong>
          <small id="speedSource">Potensio</small>
        </div>
        <input id="speedSlider" type="range" min="0" max="100" step="1" value="0">
        <div class="speed-actions">
          <button id="globalMouseButton" type="button" aria-pressed="false" hidden>Global Mouse OFF</button>
          <button id="speedLockButton" type="button" aria-pressed="false">Lock Slider</button>
          <button id="stopButton" type="button">STOP</button>
          <button id="potButton" type="button">Potensio</button>
        </div>
      </section>

      <section class="calibration-panel" aria-label="Kalibrasi Posisi Nol">
        <div class="calibration-header">
          <span>Kalibrasi Posisi Nol (Tahan tombol)</span>
        </div>
        <div class="calibration-actions">
          <button id="jogMotor1Backward" type="button"><i data-lucide="arrow-left"></i> M1 Mundur</button>
          <button id="jogMotor1Forward" type="button">M1 Maju <i data-lucide="arrow-right"></i></button>
        </div>
        <div class="calibration-actions" style="margin-top: 10px;">
          <button id="jogLeftButton" type="button"><i data-lucide="rotate-ccw"></i> M2 Kiri</button>
          <button id="jogRightButton" type="button">M2 Kanan <i data-lucide="rotate-cw"></i></button>
        </div>
      </section>

      <section class="table-wrap" aria-label="Mode table">
        <table>
          <thead>
            <tr>
              <th>Mode</th>
              <th>Step M1</th>
              <th>Step M2</th>
              <th>M2 x</th>
              <th>Delay M2 %</th>
              <th>Ease M1</th>
              <th>Ease M2</th>
              <th>Arah M1</th>
              <th>Arah M2</th>
              <th>Send</th>
            </tr>
          </thead>
          <tbody id="modeTableBody"></tbody>
        </table>
      </section>

      <section class="sequence-panel" aria-label="Skenario Kustom">
        <div class="sequence-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h2 style="font-size: 14px; margin: 0; color: #a1a1aa;">Skenario / Macro (Mode 11)</h2>
          <button id="sendSequenceButton" type="button" disabled style="background: var(--primary); border: none; color: #fff; padding: 4px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">Kirim & Mainkan</button>
        </div>
        <div class="sequence-presets" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="preset-btn" type="button" data-preset="0" style="flex: 1; padding: 8px; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 4px; cursor: pointer;">Pemanasan</button>
          <button class="preset-btn" type="button" data-preset="1" style="flex: 1; padding: 8px; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 4px; cursor: pointer;">Agresif</button>
          <button class="preset-btn" type="button" data-preset="2" style="flex: 1; padding: 8px; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 4px; cursor: pointer;">Acak</button>
          <button class="preset-btn" type="button" data-preset="3" style="flex: 1; padding: 8px; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 4px; cursor: pointer;">Pelan-Cepat</button>
          <button class="preset-btn" type="button" data-preset="4" style="flex: 1; padding: 8px; background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; border-radius: 4px; cursor: pointer;">Gila</button>
        </div>
      </section>

      <section class="bookmark-panel" aria-label="Bookmark eksperimen">
        <div class="bookmark-header">
          <h2>Bookmark Eksperimen</h2>
          <span id="bookmarkCount">0 tersimpan</span>
        </div>
        <p id="bookmarkEmpty" class="bookmark-empty">Belum ada bookmark.</p>
        <div id="bookmarkList" class="bookmark-list"></div>
      </section>

      <section class="log-panel" aria-label="Serial log">
        <div class="log-header">
          <h2>Log</h2>
          <button id="clearLogButton" type="button">Clear</button>
        </div>
        <pre id="logOutput"></pre>
      </section>
    </main>

    <script src="../node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="./app.js?v=20260724-motion-safe8"></script>
  </body>
</html>
